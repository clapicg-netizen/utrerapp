        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
        <style>
            .mobile-launch { display: none; }
            @media (max-width: 1023px) {
                #root:empty + .mobile-launch {
                    position: fixed;
                    inset: 0;
                    display: grid;
                    place-items: center;
                    overflow: auto;
                    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                        max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                    box-sizing: border-box;
                    background: radial-gradient(ellipse at center, #fffdfa 0%, #fff 56%, #edf0f3 100%);
                    color: #27282b;
                    font: 1rem/1.3 system-ui, sans-serif;
                    text-align: center;
                }
                .mobile-launch__content {
                    position: relative;
                    isolation: isolate;
                    width: min(100%, 26rem);
                }
                .mobile-launch__content::before {
                    position: absolute;
                    z-index: -1;
                    inset: 16% -10px 9%;
                    background:
                        radial-gradient(circle at 11% 34%, #fff 0 4px, #fff4da8c 7px, transparent 16px),
                        radial-gradient(circle at 92% 29%, #fff 0 5px, #fff2dca0 8px, transparent 20px),
                        radial-gradient(circle at 5% 60%, #fff 0 3px, #fff4da95 6px, transparent 13px),
                        radial-gradient(circle at 95% 56%, #fff 0 6px, #fff2dca0 10px, transparent 20px),
                        radial-gradient(circle at 17% 83%, #fff 0 4px, #fff4da80 7px, transparent 15px),
                        radial-gradient(circle at 88% 78%, #fff 0 3px, #fff4da80 6px, transparent 12px);
                    pointer-events: none;
                    content: '';
                }
                .mobile-launch__title {
                    margin: 0 auto clamp(1rem, 5vh, 2.25rem);
                    font-size: clamp(1.8rem, 7.5vw, 2.75rem);
                    font-weight: 800;
                    letter-spacing: -0.04em;
                    line-height: 1.08;
                }
                .mobile-launch__card {
                    display: grid;
                    justify-items: center;
                    gap: 0.35rem;
                    width: fit-content;
                    margin: 0 auto;
                    padding: clamp(1rem, 4.5vw, 1.65rem);
                    border: 1px solid #fff;
                    border-radius: 2rem;
                    background: #fff;
                    box-shadow: 0 12px 45px #28374821, 0 0 26px #fff7e4;
                    font-size: clamp(2rem, 8.5vw, 3.25rem);
                    font-weight: 800;
                    letter-spacing: -0.05em;
                }
                .mobile-launch__card img {
                    width: clamp(5.5rem, 34vw, 9rem);
                    height: auto;
                    max-width: 100%;
                    object-fit: contain;
                }
                .mobile-launch__motto {
                    margin: clamp(1rem, 4vh, 2rem) 0 0;
                    font-size: clamp(1.05rem, 5.25vw, 1.5rem);
                    font-weight: 700;
                }
                .mobile-launch__url {
                    margin: clamp(0.6rem, 3vh, 1.4rem) 0 0;
                    color: #465162;
                    overflow-wrap: anywhere;
                }
            }
        </style>
    </head>
    <body>
        <noscript><style>.mobile-launch { display: none !important; }</style>Necesitas habilitar JavaScript para usar Utrerapp.</noscript>
        <div id="root"></div>
        <div class="mobile-launch" aria-hidden="true">
            <div class="mobile-launch__content">
                <p class="mobile-launch__title">Toda Utrera<br />en tu bolsillo</p>
                <div class="mobile-launch__card">
                    <img src="%PUBLIC_URL%/icons/utrerapp-launch.webp" width="177" height="180" alt="" loading="lazy" />
                    <span>UtrerApp</span>
                </div>
                <p class="mobile-launch__motto">Tu ciudad, siempre contigo</p>
                <p class="mobile-launch__url">www.utrerapp.com</p>
            </div>
        </div>
    </body>
</html>
